[project]
name = "dropdrop"
version = "2.1.0"
description = "Automated pipeline for detecting droplets and inclusions in microscopy images, powered by Cellpose"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cellpose>=4.0.7",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dropdrop = "dropdrop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropdrop"]
